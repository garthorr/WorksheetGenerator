services:
  worksheets:
    build: .
    image: worksheet-generator:latest
    container_name: worksheet-generator
    restart: unless-stopped
    env_file: .env
    environment:
      # Answer only to the Traefik host name unless .env lists others.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${WORKSHEETS_HOST:-worksheet.home.tastymath.com}}
    volumes:
      - worksheet_data:/data
    networks:
      - traefik
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    # Lets the container reach Ollama on the Docker host at
    # http://host.docker.internal:11434 (required on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.worksheets.rule=Host(`${WORKSHEETS_HOST:-worksheet.home.tastymath.com}`)"
      - "traefik.http.routers.worksheets.entrypoints=websecure"
      - "traefik.http.routers.worksheets.tls=true"
      - "traefik.http.routers.worksheets.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.worksheets.loadbalancer.server.port=8000"
      # Tailnet only: refuse every client outside Tailscale's address ranges (Traefik v3 syntax;
      # on v2 the middleware is called ipwhitelist).
      - "traefik.http.middlewares.worksheets-tailnet.ipallowlist.sourcerange=${WORKSHEETS_ALLOW:-100.64.0.0/10,fd7a:115c:a1e0::/48}"
      - "traefik.http.routers.worksheets.middlewares=worksheets-tailnet"

volumes:
  worksheet_data:

networks:
  traefik:
    external: true
    name: traefik
